<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI跨境达人营销助手</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;margin:0;background:#f5f7fb;color:#132238}header{background:linear-gradient(120deg,#132238,#2673ff);color:#fff;padding:34px 7%}h1{margin:8px 0;font-size:30px}.wrap{max-width:1000px;margin:24px auto;padding:0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#fff;border:1px solid #e5eaf2;border-radius:14px;padding:20px;box-shadow:0 6px 20px #19305810}.full{grid-column:1/-1}.muted{color:#64748b;line-height:1.7}.metrics{display:flex;gap:12px}.metric{background:#f1f5ff;padding:14px;border-radius:10px;flex:1}.metric b{display:block;font-size:22px}.drop{display:block;border:2px dashed #9db8ee;padding:22px;text-align:center;color:#2673ff;border-radius:10px}.btn{border:0;border-radius:8px;padding:10px 14px;margin:8px 6px 0 0;background:#e8efff;color:#1e4d9c;font-weight:bold;cursor:pointer}.primary{background:#2673ff;color:#fff}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e5eaf2;text-align:left;font-size:13px}textarea{width:100%;min-height:100px;box-sizing:border-box;padding:10px;border:1px solid #dbe3ef;border-radius:8px}a{color:#2673ff}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style><header><small>AI APPLICATION PORTFOLIO · DEMO</small><h1>AI 跨境达人营销助手</h1><div>把订单数据清洗、达人 GMV 复盘和内容策略建议，整理成一条可审计的营销工作流。</div></header><main class="wrap"><div class="grid"><section class="card"><h2>① 导入订单数据</h2><p class="muted">演示数据仅在浏览器本地处理，不上传服务器。</p><label class="drop" for="file">点击加载演示数据</label><input id="file" type="file" hidden><button class="btn primary" onclick="load()">加载演示数据</button><button class="btn" onclick="clearAll()">清空</button></section><section class="card"><h2>② 生成营销洞察</h2><div class="metrics"><div class="metric"><b id="gmv">—</b>有效GMV</div><div class="metric"><b id="orders">—</b>有效订单</div><div class="metric"><b id="creators">—</b>活跃达人</div></div><button class="btn primary" onclick="alert('分析完成：已过滤无效订单并生成内容动作建议。')">分析数据</button><button class="btn" onclick="download()">导出报告</button></section><section class="card full"><h2>③ 达人表现与合作优先级</h2><div id="table" class="muted">加载演示数据后显示达人 GMV、订单数和建议动作。</div></section><section class="card"><h2>④ AI 内容策略建议</h2><textarea id="brief" placeholder="输入市场、产品或目标"></textarea><button class="btn primary" onclick="suggest()">生成建议</button><p id="out" class="muted"></p></section><section class="card"><h2>作品说明</h2><p class="muted">用于求职展示的可交互原型，抽象自 TikTok Shop 达人 GMV 自动化分析流程。</p><a href="https://github.com/yanhangqi77-hub/Influencer-GMV-Monthly-Update">查看项目源码与README →</a></section></div></main><script>var data=[['Lina','US','内容测评',126800,42],['Mia Tech','UK','教程测评',88400,31],['Tom Home','DE','场景短视频',56200,24],['待归因','—','补充信息',12800,7]];function load(){var v=data.slice(0,3),g=v.reduce(function(a,x){return a+x[3]},0),o=v.reduce(function(a,x){return a+x[4]},0);document.getElementById('gmv').textContent='¥'+g.toLocaleString();document.getElementById('orders').textContent=o;document.getElementById('creators').textContent=v.length;document.getElementById('table').innerHTML='<table><tr><th>达人</th><th>市场</th><th>GMV</th><th>订单</th><th>建议动作</th></tr>'+data.map(function(x){return '<tr><td>'+x[0]+'</td><td>'+x[1]+'</td><td>¥'+x[3].toLocaleString()+'</td><td>'+x[4]+'</td><td>'+ (x[0]=='待归因'?'补充归因信息':x[3]>80000?'优先续约':'测试新内容')+'</td></tr>'}).join('')+'</table>'}function clearAll(){location.reload()}function suggest(){var x=document.getElementById('brief').value||'TikTok Shop跨境达人内容营销';document.getElementById('out').innerHTML='<b>建议方向：</b>围绕真实场景痛点、产品卖点演示和用户结果证明设计短视频；按市场拆分内容角度，再用GMV、订单和互动表现做周度复盘。当前输入：'+x}function download(){}</script></html>
